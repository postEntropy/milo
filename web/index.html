<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `resizes-content` makes the phone's keyboard shrink the layout viewport,
         so the composer rides up with it on Android instead of being left behind
         the keys. iOS ignores it; the visual-viewport tracking covers that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- One per scheme, and for the wide screen only: the browser paints its own bars
         before any script runs, so the value has to be right here, not only once the
         theme setting is known — but a `theme-color` is exactly what paints a phone's
         bar a solid colour, ours and Safari's alike, and a phone's bar is meant to be
         the page showing through it. A phone therefore matches neither of these (the
         app renders nothing on mount there either; see `App.tsx`). -->
    <meta name="theme-color" content="#FFFFFF" media="(min-width: 901px) and (prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F10" media="(min-width: 901px) and (prefers-color-scheme: dark)" />
    <!-- The theme has to be on the document before the first paint, not in a React
         effect: Safari reads the page's colour for its own bars as it paints, so a
         light first frame — the stylesheet's own default — is what leaves them
         light. Served as its own file rather than inline, because the page's CSP
         allows no inline script; same rule the app applies on mount, from the same
         key. -->
    <script src="/theme.js"></script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The manifest names no `start_url` on purpose: an installed home-screen
         app then opens at the address it was added from, and on an iPhone that
         address is the only thing that carries the token — its storage is
         separate from Safari's. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Full screen from the home screen: no browser chrome, and the stylesheet
         keeps every surface clear of the status bar and the home indicator. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent, so the page runs under the status bar and the app is what shows
         through it — the only way a Home Screen web app gets an edge-to-edge top. The
         key is deprecated and Apple asks for its removal on the grounds that the
         status bar's text goes white with it, which the light theme would rather it
         did not; but it is what stands between us and the solid strip. Without it iOS
         fills the top inset with a solid colour and pushes the page down (WebKit bug
         300445, moved to Apple as a Safari issue; 301994 measures the strip at 62px,
         above the web layer and out of range of every element). iOS reads this key
         **at install time**, so the icon has to come off the Home Screen and go back
         on for a change here to land. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milo" />
    <meta name="referrer" content="no-referrer" />
    <title>Milo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
