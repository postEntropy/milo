<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `resizes-content` makes the phone's keyboard shrink the layout viewport,
         so the composer rides up with it on Android instead of being left behind
         the keys. iOS ignores it; the visual-viewport tracking covers that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f3ed" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Full screen from the home screen: no browser chrome, and the stylesheet
         keeps every surface clear of the status bar and the home indicator. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Milo" />
    <meta name="referrer" content="no-referrer" />
    <title>Milo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
